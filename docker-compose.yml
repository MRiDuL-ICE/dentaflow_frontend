services:
  web:
    build: .
    container_name: dentaflow_web
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true  # hot reload in Docker

volumes:
  node_modules: